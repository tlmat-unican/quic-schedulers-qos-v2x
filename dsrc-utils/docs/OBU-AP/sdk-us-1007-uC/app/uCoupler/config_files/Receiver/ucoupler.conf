#
# Configuration file for uCoupler service.
#

#======================= Global Settings =======================

[global]

# Channel number of the first dsrc interface
   dsrc0_channel = 178

# Channel number of the second dsrc interface
   dsrc1_channel = 172

#======================= Service Settings ======================

# Up to 10 services can be added, but only 1 UART service allowed.
# [service_name]: name of the service assigned by user
# serv_type: IPV4 or UART
# serv_radio: 0 or 1. DSRC radio interface
# serv_psid: 0 to 270549119 (int). Use 16480 to 16511 for testing
# data_rate: 6, 9, 12, 18, 24, 36, 48 and 54 (500kbps)
# tx_power: 1 to 20 (int, dBm)
# remote_ipv4_addr: IP address of the device connected via Ethernet
# remote_ipv4_port: UDP port of the device connected via Ethernet

[test_wsm]
   serv_type = IPV4
   serv_radio = 0
   serv_psid = 16480
   data_rate = 6
   tx_power = 20
   remote_ipv4_addr = 192.168.1.10
   remote_ipv4_port = 4444

[test_channel_1]
   serv_type = IPV4
   serv_radio = 1
   serv_psid = 16481
   data_rate = 6
   tx_power = 20
   remote_ipv4_addr = 192.168.10.10
   remote_ipv4_port = 4445

[test_uart]
  serv_type = UART
  serv_radio = 0
  serv_psid = 16482
  data_rate = 18
  tx_power = 16
